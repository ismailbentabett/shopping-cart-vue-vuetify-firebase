<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title">
  <title id="title">Shopping Cart banner</title>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19" stop-opacity="0"/>
      <stop offset="1" stop-color="#FACC15" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="wash2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#0B0F19" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0"><stop offset="0.00" stop-color="#F97316"/><stop offset="1.00" stop-color="#FACC15"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#0B0F19"/>
    <rect width="1280" height="400" fill="url(#wash)"/>
    <rect width="1280" height="400" fill="url(#wash2)"/>
    <rect width="1280" height="400" fill="url(#dots)" opacity="0.06"/>
  </g>
  <g transform="translate(88 100) scale(0.78125)">
    <rect width="256" height="256" rx="56" fill="url(#tile)"/>
    <path d="M92 92H200L182 160H94Z" fill="#FFFFFF" fill-opacity="0.22"/><g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M48 64H72L94 160H182L200 92H79"/></g><circle cx="106" cy="196" r="14" fill="#FFFFFF"/><circle cx="170" cy="196" r="14" fill="#FFFFFF"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="340" y="188" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Shopping Cart</text>
    <text x="340" y="240" font-size="26" font-weight="400" fill="#A1A8B8">A Firebase-backed storefront starter built with Vue 2 and Vuetify</text>
    <rect x="340" y="282" width="84" height="40" rx="20" fill="#F97316" fill-opacity="0.08" stroke="#F97316" stroke-width="1"/><text x="382" y="308" text-anchor="middle" font-size="17" font-weight="600" fill="#E5E7EB">Vue 2</text>
    <rect x="436" y="282" width="122" height="40" rx="20" fill="#F97316" fill-opacity="0.08" stroke="#F97316" stroke-width="1"/><text x="497" y="308" text-anchor="middle" font-size="17" font-weight="600" fill="#E5E7EB">Vuetify 2</text>
    <rect x="570" y="282" width="160" height="40" rx="20" fill="#F97316" fill-opacity="0.08" stroke="#F97316" stroke-width="1"/><text x="650" y="308" text-anchor="middle" font-size="17" font-weight="600" fill="#E5E7EB">Firebase Auth</text>
    <rect x="742" y="282" width="180" height="40" rx="20" fill="#F97316" fill-opacity="0.08" stroke="#F97316" stroke-width="1"/><text x="832" y="308" text-anchor="middle" font-size="17" font-weight="600" fill="#E5E7EB">Cloud Firestore</text>
    <rect x="934" y="282" width="160" height="40" rx="20" fill="#F97316" fill-opacity="0.08" stroke="#F97316" stroke-width="1"/><text x="1014" y="308" text-anchor="middle" font-size="17" font-weight="600" fill="#E5E7EB">Cloud Storage</text>
  </g>
</svg>
