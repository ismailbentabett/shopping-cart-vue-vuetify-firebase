name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        Do not include Firebase API keys, passwords or other secrets in this form.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run serve` in `shop/`
        2. Go to '...'
        3. Click on '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication (login / signup / logout)
        - Products (add / list / edit / delete)
        - Image upload (Cloud Storage)
        - Home page / layout
        - Build / tooling
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 120, Firefox 121
  - type: input
    id: node
    attributes:
      label: Node.js and npm version
      placeholder: e.g. Node 16.20.2, npm 8.19.4
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      description: Paste relevant browser console or terminal output.
      render: shell
